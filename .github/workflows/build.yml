name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for (all/android/ios)
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile (development/production)
        type: choice
        required: true
        default: development
        options:
          - development
          - production
      submit:
        description: Auto submit to the store? (production only)
        type: boolean
        required: false

jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 👷 Build packages for wallet
        run: pnpm run -w build:wallet

      # Remove this step and configure the app to contain your own project and bundle identifiers.
      # This is intentionally omitted in the template repository to guide users through the setup when cloning.
      - name: 👷 Configure project
        working-directory: apps/wallet
        run: |
          eas init --id ffd909b9-8b21-4311-b6b6-f795be84def1 --force --non-interactive
          echo $(jq '.expo.runtimeVersion.policy = "sdkVersion"' app.json) > app.json
          echo $(jq '.expo.android.package = "org.nedfinance.wallet"' app.json) > app.json
          echo $(jq '.expo.ios.bundleIdentifier = "org.nedfinance.wallet"' app.json) > app.json

      - name: 🚀 Build wallet
        if:
          ${{ github.event.inputs.submit == 'false' ||
          github.event.inputs.profile != 'production' }}
        working-directory: apps/wallet
        run:
          eas build --non-interactive --wait --platform=${{
          github.event.inputs.platform }} --profile=${{
          github.event.inputs.profile }}

      - name: 🚀 Build & submit wallet
        if:
          ${{ github.event.inputs.submit == 'true' &&
          github.event.inputs.profile != 'production' }}
        working-directory: apps/wallet
        run:
          eas build --non-interactive --wait --auto-submit --platform=${{
          github.event.inputs.platform }} --profile=${{
          github.event.inputs.profile }}
